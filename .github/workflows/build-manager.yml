name: Build Manager (BakaSU Pro compatibility)

# Keep reusable callers working; the manual entry is Build BakaSU Pro.
on:
  workflow_call:
    inputs:
      package_name:
        required: false
        default: ''
        type: string
    secrets:
      KEYSTORE:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true
      KEY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  build-manager:
    uses: ./.github/workflows/build-private-manager.yml
    with:
      package_name: ${{ inputs.package_name }}
    secrets: inherit
