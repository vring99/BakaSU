name: Release BakaSU Pro
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to create at the selected commit, e.g. v4.1.0-pro.1'
        required: true
        type: string
      package_name:
        description: 'Android package name (leave empty to generate a random name)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-manager:
    uses: ./.github/workflows/build-private-manager.yml
    with:
      package_name: ${{ inputs.package_name || '' }}
    secrets: inherit
  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    steps:
      - name: Download Manager artifacts
        uses: actions/download-artifact@v8
        with:
          path: manager
          name: BakaSU-Pro-release

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(inputs.tag_name || github.ref_name, '-rc') }}
          fail_on_unmatched_files: true
          files: |
            manager/*.apk
            manager/SHA256SUMS.txt
            manager/manager-identity.json
            manager/manager-cert.der
            manager/gki-manager-signature.patch
